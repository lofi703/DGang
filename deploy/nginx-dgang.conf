# DGang — reverse proxy to Node on :3000 (dgang.mooo.com)
server {
    server_name dgang.mooo.com www.dgang.mooo.com;

    # Socket.IO needs websocket upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location ~ ^/media/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache app logic so fixes reach users
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}

server {
    if ($host = dgang.mooo.com) { return 301 https://$host$request_uri; }
    if ($host = www.dgang.mooo.com) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name dgang.mooo.com www.dgang.mooo.com;
    return 404;
}